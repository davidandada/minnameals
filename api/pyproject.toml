[project]
name = "vercel-flask-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4.0",
  "gunicorn~=23.0.0",
  "typing-extensions",
  "supabase",
  "python-dotenv",
  "fractional-indexing"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["routes*", "helpers*"]

[tool.setuptools]
py-modules = ["index"]
